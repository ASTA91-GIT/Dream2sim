<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 240" width="100%" height="100%">
  <defs>
    <linearGradient id="flowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <filter id="nodeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .flow-line {
      stroke: #334155;
      stroke-width: 2;
    }
    .flow-pulse {
      stroke: url(#flowGrad);
      stroke-width: 3.5;
      stroke-dasharray: 40 200;
      animation: pulseDash 2.5s linear infinite;
    }
    @keyframes pulseDash {
      from { stroke-dashoffset: 240; }
      to { stroke-dashoffset: 0; }
    }
    .box-title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-weight: 700;
      font-size: 13px;
      fill: #f8fafc;
    }
    .box-subtitle {
      font-family: monospace;
      font-size: 10px;
      fill: #94a3b8;
    }
    .badge {
      font-family: monospace;
      font-weight: 600;
      font-size: 9px;
    }
  </style>

  <!-- Background -->
  <rect width="1100" height="240" rx="14" fill="#090d16" stroke="#1e293b" stroke-width="1.5" />

  <!-- Connecting Pipes with Animated Pulses -->
  <!-- Pipe 1 -->
  <line x1="200" y1="120" x2="260" y2="120" class="flow-line" />
  <line x1="200" y1="120" x2="260" y2="120" class="flow-pulse" />

  <!-- Pipe 2 -->
  <line x1="460" y1="120" x2="520" y2="120" class="flow-line" />
  <line x1="460" y1="120" x2="520" y2="120" class="flow-pulse" />

  <!-- Pipe 3 -->
  <line x1="720" y1="120" x2="780" y2="120" class="flow-line" />
  <line x1="720" y1="120" x2="780" y2="120" class="flow-pulse" />

  <!-- ==================== STAGE 1: Natural Input ==================== -->
  <g transform="translate(30, 45)">
    <rect width="170" height="150" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" />
    <circle cx="25" cy="28" r="10" fill="#0284c7" opacity="0.4" />
    <text x="25" y="32" text-anchor="middle" fill="#38bdf8" font-size="12">🎙️</text>
    <text x="44" y="28" class="badge" fill="#38bdf8">01. MULTIMODAL</text>
    <text x="18" y="58" class="box-title">Natural Intent</text>
    <text x="18" y="78" class="box-subtitle">• Prompt Text</text>
    <text x="18" y="96" class="box-subtitle">• Muse Voice Speech</text>
    <text x="18" y="114" class="box-subtitle">• SAM 3.1 Aerial Photo</text>
    <rect x="18" y="128" width="134" height="6" rx="3" fill="#1e293b" />
    <rect x="18" y="128" width="80" height="6" rx="3" fill="#38bdf8">
      <animate attributeName="width" values="40;134;40" dur="3s" repeatCount="indefinite" />
    </rect>
  </g>

  <!-- ==================== STAGE 2: Muse Spark ==================== -->
  <g transform="translate(260, 45)">
    <rect width="200" height="150" rx="12" fill="#0f172a" stroke="#818cf8" stroke-width="1.2" />
    <circle cx="25" cy="28" r="10" fill="#4338ca" opacity="0.4" />
    <text x="25" y="32" text-anchor="middle" fill="#818cf8" font-size="12">✨</text>
    <text x="44" y="28" class="badge" fill="#818cf8">02. META MUSE SPARK</text>
    <text x="18" y="58" class="box-title">Geometry Synthesis</text>
    <text x="18" y="78" class="box-subtitle">• Structured Outputs</text>
    <text x="18" y="96" class="box-subtitle">• Entity &amp; Constraint Parser</text>
    <text x="18" y="114" class="box-subtitle">• Pydantic v2 Schema Gate</text>
    <rect x="18" y="128" width="164" height="6" rx="3" fill="#1e293b" />
    <rect x="18" y="128" width="120" height="6" rx="3" fill="#818cf8">
      <animate attributeName="width" values="60;164;60" dur="3s" repeatCount="indefinite" />
    </rect>
  </g>

  <!-- ==================== STAGE 3: Python Physics Engine ==================== -->
  <g transform="translate(520, 45)">
    <rect width="200" height="150" rx="12" fill="#0f172a" stroke="#10b981" stroke-width="1.2" />
    <circle cx="25" cy="28" r="10" fill="#065f46" opacity="0.4" />
    <text x="25" y="32" text-anchor="middle" fill="#10b981" font-size="12">⚙️</text>
    <text x="44" y="28" class="badge" fill="#10b981">03. PYTHON ENGINE</text>
    <text x="18" y="58" class="box-title">IDM Determinism</text>
    <text x="18" y="78" class="box-subtitle">• Intelligent Driver Model</text>
    <text x="18" y="96" class="box-subtitle">• Multi-Phase Signal Timing</text>
    <text x="18" y="114" class="box-subtitle">• Exact Queue Calculus</text>
    <rect x="18" y="128" width="164" height="6" rx="3" fill="#1e293b" />
    <rect x="18" y="128" width="140" height="6" rx="3" fill="#10b981">
      <animate attributeName="width" values="80;164;80" dur="3s" repeatCount="indefinite" />
    </rect>
  </g>

  <!-- ==================== STAGE 4: PixiJS & Muse Wonder ==================== -->
  <g transform="translate(780, 45)">
    <rect width="280" height="150" rx="12" fill="#0f172a" stroke="#c084fc" stroke-width="1.2" />
    <circle cx="25" cy="28" r="10" fill="#6b21a8" opacity="0.4" />
    <text x="25" y="32" text-anchor="middle" fill="#c084fc" font-size="12">🧠</text>
    <text x="44" y="28" class="badge" fill="#c084fc">04. PIXIJS &amp; MUSE WONDER</text>
    <text x="18" y="58" class="box-title">Visuals &amp; Deep Reasoning</text>
    <text x="18" y="78" class="box-subtitle">• PixiJS 60 FPS WebGL Canvas</text>
    <text x="18" y="96" class="box-subtitle">• Muse Wonder Bottleneck Analysis</text>
    <text x="18" y="114" class="box-subtitle">• Automated Signal Optimization</text>
    <rect x="18" y="128" width="244" height="6" rx="3" fill="#1e293b" />
    <rect x="18" y="128" width="200" height="6" rx="3" fill="#c084fc">
      <animate attributeName="width" values="100;244;100" dur="3s" repeatCount="indefinite" />
    </rect>
  </g>
</svg>
